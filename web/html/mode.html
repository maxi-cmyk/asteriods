            <section data-view="mode" class="utility-view flight-mode" hidden inert>
                <h1 tabindex="-1">Choose your flight</h1>
                <div class="mode-options">
                    <button id="soloPlay" class="mode-card primary">
                        <canvas id="modeArtSolo" width="192" height="108" aria-hidden="true"></canvas>
                        <em>1 PLAYER</em>
                        <strong>Solo flight</strong>
                        <span>One pilot</span>
                    </button>
                    <button id="localPlay" class="mode-card">
                        <canvas id="modeArtCoop" width="192" height="108" aria-hidden="true"></canvas>
                        <em>2 PLAYERS</em>
                        <strong>Local co-op</strong>
                        <span>Two pilots, one field</span>
                    </button>
                </div>
                <div class="mode-foot">
                    <button id="modeHangar" data-go="hangar">
                        <canvas id="modeHull" width="24" height="16" aria-hidden="true"></canvas>
                        <b id="modeHullName">Vanguard</b>
                        <u>Change ship</u>
                    </button>
                    <p>Co-op: two controllers, or keyboard + controller.</p>
                </div>
            </section>
